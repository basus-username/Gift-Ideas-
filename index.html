<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gift Tags</title>
<meta name="theme-color" content="#8C2F45">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gift Tags">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0E2;
    --surface:#FFFFFF;
    --ink:#2B2A28;
    --ink-soft:#6B6A62;
    --berry:#8C2F45;
    --berry-dark:#6E2236;
    --gold:#C48A1E;
    --line:#D7D9C8;
    --hole:#EEF0E2;
    --danger:#B23A2E;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  .display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;}

  header.top{
    padding:28px 20px 18px;
    position:relative;
  }
  header.top h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    margin:0 0 2px;
    font-optical-sizing:auto;
  }
  header.top p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .dashed-divider{
    border:none;
    border-top:2px dashed var(--line);
    margin:0 20px;
  }

  main{padding:18px 16px 0;}
  section{margin-bottom:26px;}
  section h2{
    font-family:'Fraunces',serif;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:0 4px 12px;
    font-weight:600;
  }

  /* Upcoming strip */
  .upcoming-row{display:flex;gap:10px;overflow-x:auto;padding:2px 4px 8px;scrollbar-width:none;}
  .upcoming-row::-webkit-scrollbar{display:none;}
  .upcoming-card{
    flex:0 0 auto;
    background:var(--berry);
    color:#fff;
    border-radius:var(--radius);
    padding:12px 14px;
    min-width:150px;
    position:relative;
  }
  .upcoming-card .days{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    opacity:0.85;
    text-transform:uppercase;
  }
  .upcoming-card .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    margin:2px 0 1px;
  }
  .upcoming-card .occ{font-size:12px;opacity:0.9;}
  .empty-upcoming{
    color:var(--ink-soft);
    font-size:13px;
    padding:14px 4px;
    font-style:italic;
  }

  /* Person tag card */
  .tag-card{
    background:var(--surface);
    border-radius:var(--radius);
    margin:0 4px 12px;
    padding:14px 16px 14px 44px;
    position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
    border:1px solid var(--line);
  }
  .tag-card .hole{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:14px;height:14px;
    border-radius:50%;
    background:var(--hole);
    border:2px solid var(--line);
  }
  .tag-card .relation-pill{
    display:inline-block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:2px 8px;
    border-radius:20px;
    font-family:'IBM Plex Mono',monospace;
    margin-bottom:4px;
  }
  .pill-friend{background:#E7EEDD;color:#4C6B2F;}
  .pill-family{background:#F3E3E7;color:var(--berry-dark);}
  .pill-colleague{background:#E6EAF2;color:#3A4C7A;}
  .tag-card .p-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 2px;
  }
  .tag-card .p-meta{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .tag-card .p-next{
    margin-top:6px;
    font-size:12px;
    color:var(--gold);
    font-weight:600;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .empty-state .display{font-size:20px;color:var(--ink);margin-bottom:6px;}

  /* FAB */
  .fab{
    position:fixed;
    right:18px;
    bottom:22px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--berry);
    color:#fff;
    border:none;
    font-size:28px;
    box-shadow:0 4px 14px rgba(140,47,69,0.4);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  .fab:active{transform:scale(0.94);}

  /* Modal / sheet */
  .sheet-overlay{
    position:fixed;inset:0;
    background:rgba(43,42,40,0.45);
    z-index:50;
    display:none;
  }
  .sheet-overlay.open{display:block;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--bg);
    border-radius:20px 20px 0 0;
    max-height:88vh;
    overflow-y:auto;
    z-index:51;
    transform:translateY(100%);
    transition:transform 0.25s ease;
    padding:18px 18px 30px;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:38px;height:4px;background:var(--line);
    border-radius:4px;margin:0 auto 14px;
  }
  .sheet h3{
    font-family:'Fraunces',serif;
    font-size:22px;margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-family:'IBM Plex Mono',monospace;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--surface);
    font-family:'Public Sans',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--berry);
  }
  .field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.4;}
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    padding:6px 12px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--surface);
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background:var(--berry);
    border-color:var(--berry);
    color:#fff;
  }
  .style-pill-row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;}
  .style-pill{
    font-size:11px;
    padding:3px 9px;
    border-radius:14px;
    background:#F0EFE6;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .occ-row{display:flex;gap:8px;margin-bottom:8px;}
  .occ-row input[type=text]{flex:1.3;}
  .occ-row input[type=date]{flex:1;}
  .occ-row button{
    flex:0 0 auto;background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:0 6px;
  }
  .btn-add-line{
    background:none;border:1.5px dashed var(--line);color:var(--ink-soft);
    padding:8px;border-radius:10px;width:100%;font-size:13px;cursor:pointer;margin-top:2px;
  }
  .btn-row{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;padding:13px;border-radius:10px;border:none;
    font-family:'Public Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;
  }
  .btn-primary{background:var(--berry);color:#fff;}
  .btn-secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
  .btn-danger-text{background:none;color:var(--danger);border:none;font-size:13px;text-decoration:underline;padding:6px;margin-top:6px;}

  /* Detail sheet specifics */
  .detail-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;}
  .detail-header .close-x{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;}
  .idea-item{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    margin-bottom:8px;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .idea-item.bought{opacity:0.55;}
  .idea-item .idea-text{flex:1;font-size:14.5px;line-height:1.4;}
  .idea-item .idea-reason{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .idea-item .idea-actions{display:flex;flex-direction:column;gap:4px;}
  .idea-item .idea-actions button{
    background:none;border:none;font-size:15px;cursor:pointer;color:var(--ink-soft);padding:2px;
  }
  .idea-item .idea-actions button.check-on{color:#4C6B2F;}

  .ai-btn{
    width:100%;
    background:var(--gold);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:10px;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    margin-bottom:12px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .ai-btn:disabled{opacity:0.6;}
  .spinner{
    width:14px;height:14px;border:2px solid rgba(255,255,255,0.5);
    border-top-color:#fff;border-radius:50%;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .manual-add-row{display:flex;gap:8px;margin-bottom:16px;}
  .manual-add-row input{flex:1;}
  .manual-add-row button{
    background:var(--berry);color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;
  }

  .toast{
    position:fixed;bottom:90px;left:16px;right:16px;
    background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;
    font-size:13px;line-height:1.4;z-index:60;opacity:0;pointer-events:none;transition:opacity 0.2s;
    text-align:center;
  }
  .toast.show{opacity:1;}

  .subhead{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;font-family:'IBM Plex Mono',monospace;margin:16px 4px 8px;}
</style>
</head>
<body>

<header class="top">
  <h1>Gift Tags</h1>
  <p id="tagline">Who to think of next</p>
</header>
<hr class="dashed-divider">

<main>
  <section>
    <h2>Coming up</h2>
    <div class="upcoming-row" id="upcomingRow"></div>
  </section>

  <section>
    <h2>People</h2>
    <div id="peopleList"></div>
  </section>

  <section style="text-align:center;margin-top:6px;">
    <button class="btn-danger-text" style="color:var(--ink-soft);" onclick="exportData()">⬇ Backup data</button>
    <span style="color:var(--line);">·</span>
    <label class="btn-danger-text" style="color:var(--ink-soft);cursor:pointer;">
      ⬆ Restore backup
      <input type="file" accept="application/json" style="display:none;" onchange="importData(event)">
    </label>
  </section>

  <footer style="text-align:center;padding:20px 20px 4px;color:var(--ink-soft);font-size:11px;">
    By YE Chew
  </footer>
</main>

<button class="fab" onclick="openAddPerson()">+</button>

<!-- Add/Edit Person Sheet -->
<div class="sheet-overlay" id="overlayPerson" onclick="closeSheet('person')"></div>
<div class="sheet" id="sheetPerson">
  <div class="sheet-handle"></div>
  <div class="detail-header">
    <h3 id="personSheetTitle">Add person</h3>
    <button class="close-x" onclick="closeSheet('person')">✕</button>
  </div>
  <div class="field">
    <label>Name</label>
    <input type="text" id="pName" placeholder="e.g. Pikachew">
  </div>
  <div class="field">
    <label>Relationship</label>
    <select id="pRelation">
      <option value="friend">Friend</option>
      <option value="family">Family</option>
      <option value="colleague">Colleague</option>
    </select>
  </div>
  <div class="field">
    <label>Budget (optional)</label>
    <input type="text" id="pBudget" placeholder="e.g. RM50-100">
  </div>
  <div class="field">
    <label>Not sure what to write? Tap what fits</label>
    <div class="chip-row" id="styleChipRow"></div>
  </div>
  <div class="field">
    <label>Interests / notes</label>
    <textarea id="pInterests" placeholder="Specific and recent beats general — e.g. 'kept talking about wanting a film camera' or 'always complains their desk plants keep dying'"></textarea>
    <div class="field-hint">Tip: a recent complaint, a thing they geek out about, or what they spend weekends on works better than a personality label.</div>
  </div>
  <div class="field">
    <label>Occasions</label>
    <div id="occasionsWrap"></div>
    <button class="btn-add-line" onclick="addOccasionRow()">+ add occasion date</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="closeSheet('person')">Cancel</button>
    <button class="btn btn-primary" onclick="savePerson()">Save</button>
  </div>
  <button class="btn-danger-text" id="deletePersonBtn" style="display:none" onclick="deletePerson()">Remove this person</button>
</div>

<!-- Person Detail Sheet -->
<div class="sheet-overlay" id="overlayDetail" onclick="closeSheet('detail')"></div>
<div class="sheet" id="sheetDetail">
  <div class="sheet-handle"></div>
  <div class="detail-header">
    <div>
      <span class="relation-pill" id="dRelationPill"></span>
      <h3 id="dName" style="margin-top:2px;"></h3>
    </div>
    <button class="close-x" onclick="closeSheet('detail')">✕</button>
  </div>
  <p class="p-meta" id="dMeta" style="margin:0 0 4px;"></p>
  <div class="style-pill-row" id="dStyleTags"></div>
  <p class="p-meta" id="dInterests" style="margin:0 0 10px;"></p>
  <div id="dOccasions" style="margin:0 0 14px;"></div>

  <div class="subhead">Gift ideas</div>
  <button class="ai-btn" id="aiBtn" onclick="generateIdeas()">✨ Suggest gift ideas</button>
  <div class="manual-add-row">
    <input type="text" id="manualIdeaInput" placeholder="Add your own idea...">
    <button onclick="addManualIdea()">Add</button>
  </div>
  <div id="ideasList"></div>

  <div class="subhead">Past gifts given</div>
  <div class="manual-add-row">
    <input type="text" id="pastGiftInput" placeholder="e.g. Book (2025)">
    <button onclick="addPastGift()">Add</button>
  </div>
  <div id="pastGiftsList"></div>

  <button class="btn btn-secondary" style="margin-top:18px;width:100%;" onclick="openEditPerson()">Edit person</button>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'giftTagsData_v1';
let state = { people: [] };
let currentPersonId = null;
let occasionCount = 0;
let selectedStyleTags = [];

const STYLE_TAGS = [
  'Practical', 'Sentimental', 'Quirky / fun', 'Minimalist', 'Trendy',
  'Foodie', 'Homebody', 'Outdoorsy', 'Tech-savvy', 'Bookish',
  'Crafty / DIY', 'Collector', 'Music lover', 'Gamer', 'Plant parent',
  'Coffee or tea person', 'Fashion-forward', 'Wellness / self-care'
];

function renderStyleChips(){
  const row = document.getElementById('styleChipRow');
  row.innerHTML = STYLE_TAGS.map(tag => `
    <div class="chip ${selectedStyleTags.includes(tag) ? 'active' : ''}" onclick="toggleStyleTag('${tag.replace(/'/g,"\\'")}')">${tag}</div>
  `).join('');
}
function toggleStyleTag(tag){
  const i = selectedStyleTags.indexOf(tag);
  if(i === -1) selectedStyleTags.push(tag);
  else selectedStyleTags.splice(i,1);
  renderStyleChips();
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ console.error('load failed', e); }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 4200);
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const parts = dateStr.split('-');
  let target = new Date(today.getFullYear(), parseInt(parts[1])-1, parseInt(parts[2]));
  if(target < today) target.setFullYear(today.getFullYear()+1);
  return Math.round((target - today) / 86400000);
}

function render(){
  renderUpcoming();
  renderPeopleList();
}

function renderUpcoming(){
  const row = document.getElementById('upcomingRow');
  let items = [];
  state.people.forEach(p=>{
    (p.occasions||[]).forEach(o=>{
      const d = daysUntil(o.date);
      if(d !== null && d <= 30) items.push({person:p, occ:o, days:d});
    });
  });
  items.sort((a,b)=>a.days-b.days);
  if(items.length === 0){
    row.innerHTML = '<div class="empty-upcoming">Nothing in the next 30 days</div>';
    return;
  }
  row.innerHTML = items.map(it=>`
    <div class="upcoming-card" onclick="openDetail('${it.person.id}')">
      <div class="days">${it.days===0?'Today':it.days===1?'Tomorrow':it.days+' days'}</div>
      <div class="name">${escapeHtml(it.person.name)}</div>
      <div class="occ">${escapeHtml(it.occ.label)}</div>
    </div>
  `).join('');
}

function relationLabel(r){
  return r==='friend'?'Friend':r==='family'?'Family':'Colleague';
}
function relationPillClass(r){
  return r==='friend'?'pill-friend':r==='family'?'pill-family':'pill-colleague';
}

function renderPeopleList(){
  const list = document.getElementById('peopleList');
  if(state.people.length === 0){
    list.innerHTML = `<div class="empty-state"><div class="display">No one added yet</div>Tap + to add your first person</div>`;
    return;
  }
  const sorted = [...state.people].sort((a,b)=>a.name.localeCompare(b.name));
  list.innerHTML = sorted.map(p=>{
    const next = (p.occasions||[])
      .map(o=>({label:o.label, days:daysUntil(o.date)}))
      .filter(o=>o.days!==null)
      .sort((a,b)=>a.days-b.days)[0];
    const nextHtml = next ? `<div class="p-next">${next.label} in ${next.days} day${next.days===1?'':'s'}</div>` : '';
    return `
    <div class="tag-card" onclick="openDetail('${p.id}')">
      <div class="hole"></div>
      <span class="relation-pill ${relationPillClass(p.relation)}">${relationLabel(p.relation)}</span>
      <div class="p-name">${escapeHtml(p.name)}</div>
      <div class="p-meta">${p.budget ? escapeHtml(p.budget) : ''}</div>
      ${nextHtml}
    </div>`;
  }).join('');
}

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- Add/Edit Person Sheet ---------- */
function openAddPerson(){
  currentPersonId = null;
  document.getElementById('personSheetTitle').textContent = 'Add person';
  document.getElementById('pName').value = '';
  document.getElementById('pRelation').value = 'friend';
  document.getElementById('pBudget').value = '';
  document.getElementById('pInterests').value = '';
  document.getElementById('occasionsWrap').innerHTML = '';
  document.getElementById('deletePersonBtn').style.display = 'none';
  occasionCount = 0;
  selectedStyleTags = [];
  renderStyleChips();
  addOccasionRow();
  openSheet('person');
}

function openEditPerson(){
  const p = state.people.find(x=>x.id===currentPersonId);
  if(!p) return;
  document.getElementById('personSheetTitle').textContent = 'Edit person';
  document.getElementById('pName').value = p.name;
  document.getElementById('pRelation').value = p.relation;
  document.getElementById('pBudget').value = p.budget || '';
  document.getElementById('pInterests').value = p.interests || '';
  document.getElementById('occasionsWrap').innerHTML = '';
  occasionCount = 0;
  selectedStyleTags = Array.isArray(p.styleTags) ? [...p.styleTags] : [];
  renderStyleChips();
  (p.occasions && p.occasions.length ? p.occasions : [{label:'',date:''}]).forEach(o=>addOccasionRow(o.label, o.date));
  document.getElementById('deletePersonBtn').style.display = 'block';
  closeSheet('detail');
  openSheet('person');
}

function addOccasionRow(label='', date=''){
  occasionCount++;
  const id = 'occ_'+occasionCount;
  const wrap = document.getElementById('occasionsWrap');
  const div = document.createElement('div');
  div.className = 'occ-row';
  div.id = id;
  div.innerHTML = `
    <input type="text" placeholder="e.g. Birthday" value="${escapeHtml(label)}">
    <input type="date" value="${date}">
    <button onclick="document.getElementById('${id}').remove()">✕</button>
  `;
  wrap.appendChild(div);
}

function savePerson(){
  const name = document.getElementById('pName').value.trim();
  if(!name){ showToast('Name is required'); return; }
  const relation = document.getElementById('pRelation').value;
  const budget = document.getElementById('pBudget').value.trim();
  const interests = document.getElementById('pInterests').value.trim();
  const occRows = document.querySelectorAll('#occasionsWrap .occ-row');
  const occasions = [];
  occRows.forEach(row=>{
    const inputs = row.querySelectorAll('input');
    let label = inputs[0].value.trim();
    const date = inputs[1].value;
    if(!label && date) label = 'Birthday';
    if(label && date) occasions.push({label, date});
  });

  const styleTags = [...selectedStyleTags];

  if(currentPersonId){
    const p = state.people.find(x=>x.id===currentPersonId);
    Object.assign(p, {name, relation, budget, interests, occasions, styleTags});
  } else {
    state.people.push({
      id: uid(), name, relation, budget, interests, occasions, styleTags,
      ideas: [], pastGifts: []
    });
  }
  save();
  render();
  closeSheet('person');
  showToast('Saved');
}

function deletePerson(){
  if(!confirm('Remove this person and all their saved ideas?')) return;
  state.people = state.people.filter(x=>x.id!==currentPersonId);
  save();
  render();
  closeSheet('person');
  showToast('Removed');
}

/* ---------- Detail Sheet ---------- */
function openDetail(id){
  currentPersonId = id;
  const p = state.people.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('dRelationPill').className = 'relation-pill ' + relationPillClass(p.relation);
  document.getElementById('dRelationPill').textContent = relationLabel(p.relation);
  document.getElementById('dName').textContent = p.name;
  document.getElementById('dMeta').textContent = p.budget ? 'Budget: ' + p.budget : '';
  const tagsWrap = document.getElementById('dStyleTags');
  tagsWrap.innerHTML = (p.styleTags && p.styleTags.length)
    ? p.styleTags.map(t=>`<span class="style-pill">${escapeHtml(t)}</span>`).join('')
    : '';
  document.getElementById('dInterests').textContent = p.interests ? p.interests : 'No interests noted yet';
  const occWrap = document.getElementById('dOccasions');
  if(p.occasions && p.occasions.length){
    occWrap.innerHTML = p.occasions.map(o=>{
      const d = daysUntil(o.date);
      const dateNice = new Date(o.date+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric'});
      return `<div class="p-meta" style="margin:2px 0;">🎁 ${escapeHtml(o.label)} — ${dateNice}${d!==null ? ' ('+(d===0?'today':d===1?'tomorrow':d+' days')+')' : ''}</div>`;
    }).join('');
  } else {
    occWrap.innerHTML = '<div class="p-meta" style="font-style:italic;">No occasion dates added</div>';
  }
  renderIdeas();
  renderPastGifts();
  openSheet('detail');
}

function renderIdeas(){
  const p = state.people.find(x=>x.id===currentPersonId);
  const list = document.getElementById('ideasList');
  if(!p.ideas || p.ideas.length===0){
    list.innerHTML = '<div class="empty-state" style="padding:16px 4px;">No ideas yet</div>';
    return;
  }
  list.innerHTML = p.ideas.map((idea, i)=>`
    <div class="idea-item ${idea.bought?'bought':''}">
      <div class="idea-text">
        ${escapeHtml(idea.text)}
        ${idea.reason ? `<div class="idea-reason">${escapeHtml(idea.reason)}</div>` : ''}
      </div>
      <div class="idea-actions">
        <button class="${idea.bought?'check-on':''}" onclick="toggleBought(${i})" title="Mark as bought">${idea.bought?'✓':'○'}</button>
        <button onclick="removeIdea(${i})" title="Remove">✕</button>
      </div>
    </div>
  `).join('');
}

function toggleBought(i){
  const p = state.people.find(x=>x.id===currentPersonId);
  p.ideas[i].bought = !p.ideas[i].bought;
  save(); renderIdeas();
}
function removeIdea(i){
  const p = state.people.find(x=>x.id===currentPersonId);
  p.ideas.splice(i,1);
  save(); renderIdeas();
}
function addManualIdea(){
  const input = document.getElementById('manualIdeaInput');
  const text = input.value.trim();
  if(!text) return;
  const p = state.people.find(x=>x.id===currentPersonId);
  p.ideas = p.ideas || [];
  p.ideas.unshift({text, reason:'', bought:false, source:'manual'});
  save(); renderIdeas();
  input.value = '';
}

function renderPastGifts(){
  const p = state.people.find(x=>x.id===currentPersonId);
  const list = document.getElementById('pastGiftsList');
  if(!p.pastGifts || p.pastGifts.length===0){
    list.innerHTML = '<div class="empty-state" style="padding:12px 4px;font-size:13px;">None recorded</div>';
    return;
  }
  list.innerHTML = p.pastGifts.map((g,i)=>`
    <div class="idea-item">
      <div class="idea-text">${escapeHtml(g)}</div>
      <div class="idea-actions"><button onclick="removePastGift(${i})">✕</button></div>
    </div>
  `).join('');
}
function addPastGift(){
  const input = document.getElementById('pastGiftInput');
  const text = input.value.trim();
  if(!text) return;
  const p = state.people.find(x=>x.id===currentPersonId);
  p.pastGifts = p.pastGifts || [];
  p.pastGifts.unshift(text);
  save(); renderPastGifts();
  input.value = '';
}
function removePastGift(i){
  const p = state.people.find(x=>x.id===currentPersonId);
  p.pastGifts.splice(i,1);
  save(); renderPastGifts();
}

/* ---------- AI Suggestions ---------- */
async function generateIdeas(){
  const p = state.people.find(x=>x.id===currentPersonId);
  const btn = document.getElementById('aiBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Thinking of ideas...';
  try{
    const nextOcc = (p.occasions||[])
      .map(o=>({label:o.label, days:daysUntil(o.date)}))
      .filter(o=>o.days!==null)
      .sort((a,b)=>a.days-b.days)[0];

    const res = await fetch('/api/gift-ideas', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        name: p.name,
        relation: p.relation,
        interests: p.interests,
        styleTags: p.styleTags || [],
        budget: p.budget,
        occasion: nextOcc ? nextOcc.label : '',
        pastGifts: p.pastGifts || []
      })
    });
    const rawBody = await res.text();
    let data;
    try{
      data = JSON.parse(rawBody);
    }catch(parseErr){
      // The server returned something that isn't JSON at all (platform-level
      // error page, cold-start crash, etc). Surface the raw status + a
      // snippet instead of a silent generic message, so this is debuggable
      // from the phone without needing the Vercel dashboard.
      throw new Error('Server returned an unexpected response (HTTP ' + res.status + '): ' +
        rawBody.slice(0, 120));
    }
    if(!res.ok || data.error){
      throw new Error(data.error || ('Request failed: ' + res.status));
    }
    if(!data.ideas || !Array.isArray(data.ideas)) throw new Error('Unexpected response shape');

    p.ideas = p.ideas || [];
    data.ideas.forEach(idea=>{
      p.ideas.unshift({text: idea.text, reason: idea.reason || '', bought:false, source:'ai'});
    });
    save();
    renderIdeas();
    showToast('Added ' + data.ideas.length + ' ideas');
  }catch(e){
    console.error(e);
    showToast(e.message || 'Could not get ideas — try again');
  }finally{
    btn.disabled = false;
    btn.innerHTML = '✨ Suggest gift ideas';
  }
}

/* ---------- Sheets ---------- */
function openSheet(name){
  document.getElementById('overlay'+cap(name)).classList.add('open');
  document.getElementById('sheet'+cap(name)).classList.add('open');
}
function closeSheet(name){
  document.getElementById('overlay'+cap(name)).classList.remove('open');
  document.getElementById('sheet'+cap(name)).classList.remove('open');
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---------- Backup / Restore ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `gift-tags-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup file downloaded');
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.people)) throw new Error('Invalid backup file');
      if(!confirm(`This will replace all current data with the backup (${parsed.people.length} people). Continue?`)) return;
      state = parsed;
      save();
      render();
      showToast('Backup restored');
    }catch(err){
      console.error(err);
      showToast('Could not read that backup file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ---------- Init ---------- */
load();
render();
renderStyleChips();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
